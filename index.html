<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEO Top-Up - សេវាកម្មបញ្ចូល Diamond 24/7</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #38bdf8;
            font-size: 24px;
        }
        .header p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 5px;
        }
        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .card label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #38bdf8;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 16px;
            margin-bottom: 15px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .item {
            background-color: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .item:hover {
            border-color: #22c55e;
            background-color: #1e293b;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
        }
        .item img {
            width: 45px;
            height: 45px;
            margin-bottom: 8px;
        }
        .item .diamonds {
            font-weight: bold;
            font-size: 14px;
            color: #ffffff;
        }
        .item .price {
            font-size: 14px;
            color: #22c55e;
            font-weight: bold;
            margin-top: 5px;
            background-color: rgba(34, 197, 94, 0.1);
            padding: 4px 8px;
            border-radius: 12px;
            display: inline-block;
        }
        .btn-submit {
            width: 100%;
            background-color: #22c55e;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎮 KEO Top-Up</h1>
        <p>សេវាកម្មបញ្ចូល Diamond លឿនរហ័ស 24/7</p>
    </div>

    <div class="card">
        <label>ជ្រើសរើសហ្គេម (Select Game):</label>
        <select>
            <option>Free Fire</option>
        </select>

        <label>Game ID / Player ID:</label>
        <input type="text" placeholder="ឧទាហរណ៍៖ 12345678" required>

        <label>លេខទូរស័ព្ទ ឬ Telegram ទាក់ទង:</label>
        <input type="text" placeholder="012 345 678" required>
    </div>

    <div class="card">
        <label>ជ្រើសរើសកញ្ចប់ (Select Package):</label>
        <div class="grid">
            <!-- Diamond Packages -->
            <div class="item">
                <img src="https://img.icons8.com/emoji/96/diamond-emoji.png" alt="Diamond">
                <div class="diamonds">100 Diamonds</div>
                <div class="price">$1.00</div>
            </div>
            <div class="item">
                <img src="https://img.icons8.com/emoji/96/diamond-emoji.png" alt="Diamond">
                <div class="diamonds">210 Diamonds</div>
                <div class="price">$2.10</div>
            </div>
            <div class="item">
                <img src="https://img.icons8.com/emoji/96/diamond-emoji.png" alt="Diamond">
                <div class="diamonds">530 Diamonds</div>
                <div class="price">$5.30</div>
            </div>
            <div class="item">
                <img src="https://img.icons8.com/emoji/96/diamond-emoji.png" alt="Diamond">
                <div class="diamonds">1080 Diamonds</div>
                <div class="price">$10.80</div>
            </div>
            <div class="item">
                <img src="https://img.icons8.com/emoji/96/diamond-emoji.png" alt="Diamond">
                <div class="diamonds">2180 Diamonds</div>
                <div class="price">$21.80</div>
            </div>
            <div class="item">
                <img src="https://img.icons8.com/emoji/96/diamond-emoji.png" alt="Diamond">
                <div class="diamonds">5600 Diamonds</div>
                <div class="price">$56.00</div>
            </div>

            <!-- Memberships -->
            <div class="item">
                <img src="https://img.icons8.com/fluency/96/vip.png" alt="Weekly Lite">
                <div class="diamonds">Weekly Lite</div>
                <div class="price">$0.45</div>
            </div>
            <div class="item">
                <img src="https://img.icons8.com/fluency/96/vip.png" alt="Weekly Member">
                <div class="diamonds">Weekly Member</div>
                <div class="price">$1.65</div>
            </div>
            <div class="item">
                <img src="https://img.icons8.com/fluency/96/crown.png" alt="Monthly Member">
                <div class="diamonds">Monthly Member</div>
                <div class="price">$7.80</div>
            </div>
            <div class="item">
                <img src="https://img.icons8.com/fluency/96/trophy.png" alt="Level Up Pass">
                <div class="diamonds">Level Up Pass</div>
                <div class="price">$1.65</div>
            </div>
        </div>
    </div>

    <button class="btn-submit">បន្តទៅការបង់ប្រាក់</button>
</div>

</body>
</html>
