<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEO Top-Up - សេវាកម្មបញ្ចូល Diamond 24/7</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #38bdf8;
            font-size: 24px;
        }

        .header p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 5px;
        }

        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .card label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #38bdf8;
        }

        input[type="text"],
        select,
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 15px;
            margin-bottom: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .item {
            background-color: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .item:hover {
            border-color: #38bdf8;
        }

        .item.selected {
            border-color: #22c55e;
            background-color: #1e293b;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
        }

        .item img {
            width: 45px;
            height: 45px;
            margin-bottom: 8px;
            object-fit: contain;
        }

        .item .diamonds {
            font-weight: bold;
            font-size: 14px;
            color: #ffffff;
        }

        .item .price {
            font-size: 14px;
            color: #22c55e;
            font-weight: bold;
            margin-top: 5px;
            background-color: rgba(34, 197, 94, 0.1);
            padding: 4px 8px;
            border-radius: 12px;
            display: inline-block;
        }

        .btn-submit {
            width: 100%;
            background-color: #22c55e;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: #16a34a;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 999;
        }

        .modal-content {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            border: 1px solid #334155;
        }

        .modal-content h3 {
            color: #38bdf8;
            margin-bottom: 5px;
        }

        .qr-box {
            background: white;
            padding: 10px;
            border-radius: 12px;
            display: inline-block;
            margin: 10px 0;
        }

        .qr-box img {
            width: 240px;
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        .btn-send {
            background: #22c55e;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            width: 100%;
            font-size: 16px;
        }

        .btn-send:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-close {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
            font-weight: bold;
            width: 100%;
        }

        .info {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 8px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🎮 KEO Top-Up</h1>
        <p>សេវាកម្មបញ្ចូល Diamond លឿនរហ័ស 24/7</p>
    </div>

    <!-- Player Information -->
    <div class="card">

        <label>ជ្រើសរើសហ្គេម (Select Game):</label>

        <select id="game">
            <option value="Free Fire">Free Fire</option>
        </select>

        <label>Game ID / Player ID:</label>

        <input
            type="text"
            id="playerId"
            placeholder="ឧទាហរណ៍៖ 12345678"
            required
        >

        <label>លេខទូរស័ព្ទ ឬ Telegram ទាក់ទង:</label>

        <input
            type="text"
            id="contact"
            placeholder="012 345 678"
            required
        >

    </div>


    <!-- Packages -->
    <div class="card">

        <label>ជ្រើសរើសកញ្ចប់ (Select Package):</label>

        <div class="grid" id="packageGrid">

            <div class="item"
                 onclick="selectPackage(this, '100 Diamonds', '$1.00')">
                <img
                    src="https://cdn-icons-png.flaticon.com/512/2909/2909562.png"
                    alt="Diamond"
                >
                <div class="diamonds">100 Diamonds</div>
                <div class="price">$1.00</div>
            </div>


            <div class="item"
                 onclick="selectPackage(this, '210 Diamonds', '$2.10')">
                <img
                    src="https://cdn-icons-png.flaticon.com/512/2909/2909562.png"
                    alt="Diamond"
                >
                <div class="diamonds">210 Diamonds</div>
                <div class="price">$2.10</div>
            </div>


            <div class="item"
                 onclick="selectPackage(this, '530 Diamonds', '$5.30')">
                <img
                    src="https://cdn-icons-png.flaticon.com/512/2909/2909562.png"
                    alt="Diamond"
                >
                <div class="diamonds">530 Diamonds</div>
                <div class="price">$5.30</div>
            </div>


            <div class="item"
                 onclick="selectPackage(this, '1080 Diamonds', '$10.80')">
                <img
                    src="https://cdn-icons-png.flaticon.com/512/2909/2909562.png"
                    alt="Diamond"
                >
                <div class="diamonds">1080 Diamonds</div>
                <div class="price">$10.80</div>
            </div>


            <div class="item"
                 onclick="selectPackage(this, '2180 Diamonds', '$21.80')">
                <img
                    src="https://cdn-icons-png.flaticon.com/512/2909/2909562.png"
                    alt="Diamond"
                >
                <div class="diamonds">2180 Diamonds</div>
                <div class="price">$21.80</div>
            </div>


            <div class="item"
                 onclick="selectPackage(this, '5600 Diamonds', '$56.00')">
                <img
                    src="https://cdn-icons-png.flaticon.com/512/2909/2909562.png"
                    alt="Diamond"
                >
                <div class="diamonds">5600 Diamonds</div>
                <div class="price">$56.00</div>
            </div>


            <div class="item"
                 onclick="selectPackage(this, 'Weekly Lite', '$0.45')">
                <img
                    src="https://cdn-icons-png.flaticon.com/512/2558/2558944.png"
                    alt="Weekly Lite"
                >
                <div class="diamonds">Weekly Lite</div>
                <div class="price">$0.45</div>
            </div>


            <div class="item"
                 onclick="selectPackage(this, 'Weekly Member', '$1.65')">
                <img
                    src="https://cdn-icons-png.flaticon.com/512/2558/2558944.png"
                    alt="Weekly Member"
                >
                <div class="diamonds">Weekly Member</div>
                <div class="price">$1.65</div>
            </div>


            <!-- Monthly $7.80 -->
            <div class="item"
                 onclick="selectPackage(this, 'Monthly Member', '$7.80')">
                <img
                    src="https://cdn-icons-png.flaticon.com/512/1828/1828884.png"
                    alt="Monthly Member"
                >
                <div class="diamonds">Monthly Member</div>
                <div class="price">$7.80</div>
            </div>


            <div class="item"
                 onclick="selectPackage(this, 'Level Up Pass', '$1.65')">
                <img
                    src="https://cdn-icons-png.flaticon.com/512/3112/3112946.png"
                    alt="Level Up Pass"
                >
                <div class="diamonds">Level Up Pass</div>
                <div class="price">$1.65</div>
            </div>

        </div>
    </div>


    <button
        class="btn-submit"
        onclick="showModal()">
        បន្តទៅការបង់ប្រាក់
    </button>

</div>


<!-- Payment Modal -->
<div class="modal" id="paymentModal">

    <div class="modal-content">

        <h3>ស្កែន QR Code ដើម្បីបង់ប្រាក់</h3>

        <div class="qr-box">

            <!-- ABA KHQR របស់អ្នក -->
            <img
                src="data:image/jpeg;base64,PASTE_YOUR_QR_BASE64_HERE"
                alt="ABA KHQR Code"
            >

        </div>


        <div style="text-align:left; margin-top:5px;">

            <label
                style="
                    font-size:13px;
                    color:#38bdf8;
                    font-weight:bold;
                ">
                បញ្ចូលរូបថតវិក្កយបត្រ (Receipt):
            </label>

            <input
                type="file"
                id="receiptFile"
                accept="image/*"
                style="margin-top:5px;"
            >

        </div>


        <button
            class="btn-send"
            id="btnSend"
            onclick="sendOrderToTelegram()">
            ផ្ញើការបញ្ជាទិញ
        </button>


        <button
            class="btn-close"
            onclick="closeModal()">
            បិទ
        </button>

    </div>

</div>


<script>

    /*
     * IMPORTANT:
     * ដាក់ Bot Token របស់អ្នកនៅទីនេះ
     * កុំបង្ហោះ Token ទៅ GitHub/public website។
     */

    const BOT_TOKEN = "YOUR_OLD_BOT_TOKEN";

    const CHAT_ID = "5129300837";


    let selectedPkg = "";
    let selectedPrice = "";


    // Select Package
    function selectPackage(element, packageName, price) {

        const items = document.querySelectorAll(".item");

        items.forEach(item => {
            item.classList.remove("selected");
        });

        element.classList.add("selected");

        selectedPkg = packageName;
        selectedPrice = price;
    }


    // Open Payment Modal
    function showModal() {

        const playerId =
            document.getElementById("playerId").value.trim();

        const contact =
            document.getElementById("contact").value.trim();


        if (!playerId || !contact) {

            alert(
                "សូមបញ្ចូល Player ID និង លេខទូរស័ព្ទ/Telegram!"
            );

            return;
        }


        if (!selectedPkg) {

            alert(
                "សូមជ្រើសរើសកញ្ចប់ Diamond!"
            );

            return;
        }


        document.getElementById("paymentModal").style.display =
            "flex";
    }


    // Close Modal
    function closeModal() {

        document.getElementById("paymentModal").style.display =
            "none";
    }


    // Send Order to Telegram
    async function sendOrderToTelegram() {

        const playerId =
            document.getElementById("playerId").value.trim();

        const contact =
            document.getElementById("contact").value.trim();

        const game =
            document.getElementById("game").value;

        const fileInput =
            document.getElementById("receiptFile");

        const btnSend =
            document.getElementById("btnSend");


        if (fileInput.files.length === 0) {

            alert(
                "សូមបញ្ចូលរូបថតវិក្កយបត្របង់ប្រាក់ជាមុនសិន!"
            );

            return;
        }


        if (!selectedPkg) {

            alert(
                "សូមជ្រើសរើសកញ្ចប់ Diamond!"
            );

            return;
        }


        const photo = fileInput.files[0];


        btnSend.innerText = "កំពុងផ្ញើ...";
        btnSend.disabled = true;


        const caption =
            `🛒 ការបញ្ជាទិញថ្មី - KEO Top-Up\n\n` +
            `🎮 ហ្គេម: ${game}\n` +
            `🆔 Player ID: ${playerId}\n` +
            `💎 កញ្ចប់: ${selectedPkg}\n` +
            `💵 តម្លៃ: ${selectedPrice}\n` +
            `📞 ទាក់ទង: ${contact}`;


        const formData = new FormData();

        formData.append(
            "chat_id",
            CHAT_ID
        );

        formData.append(
            "photo",
            photo
        );

        formData.append(
            "caption",
            caption
        );


        try {

            const response = await fetch(
                `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,
                {
                    method: "POST",
                    body: formData
                }
            );


            const result =
                await response.json();


            if (result.ok) {

                alert(
                    "🎉 ការបញ្ជាទិញបានផ្ញើជោគជ័យ! " +
                    "យើងខ្ញុំនឹងពិនិត្យ និងបញ្ចូលជូនក្នុងពេលឆាប់ៗ។"
                );

                closeModal();

                location.reload();

            } else {

                alert(
                    "❌ បរាជ័យក្នុងការផ្ញើ! " +
                    "សូមពិនិត្យ Bot Token និង Telegram Bot របស់អ្នក។"
                );

            }

        } catch (error) {

            console.error(error);

            alert(
                "❌ មានបញ្ហាបណ្តាញ! សូមព្យាយាមម្តងទៀត។"
            );

        } finally {

            btnSend.innerText =
                "ផ្ញើការបញ្ជាទិញ";

            btnSend.disabled = false;
        }
    }


    // Close modal when clicking outside
    document
        .getElementById("paymentModal")
        .addEventListener("click", function(event) {

            if (event.target === this) {
                closeModal();
            }

        });

</script>

</body>
</html>
