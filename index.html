<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEO TOP UP - Home</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: white;
            text-align: center;
            padding: 20px;
        }
        header {
            padding: 20px 0;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 26px;
            color: #ffffff;
        }
        p.subtitle {
            color: #94a3b8;
            margin-top: 5px;
            font-size: 14px;
        }
        h2.section-title {
            margin-bottom: 20px;
            font-size: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .game-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .game-card h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }
        .game-card p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .btn-topup {
            display: inline-block;
            background-color: #22c55e;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
        }
        .btn-topup:active {
            background-color: #16a34a;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎮 KEO TOP UP</h1>
        <p class="subtitle">Fast & Easy Game Top Up</p>
    </header>

    <h2 class="section-title">Choose Your Game</h2>

    <!-- Free Fire Card -->
    <div class="game-card">
        <h3>🔥 Free Fire</h3>
        <p>Diamonds Top Up</p>
        <a href="freefire.html" class="btn-topup">Top Up Now</a>
    </div>

    <!-- Mobile Legends Card -->
    <div class="game-card">
        <h3>⚔️ Mobile Legends</h3>
        <p>Diamonds Top Up</p>
        <a href="mlbb.html" class="btn-topup">Top Up Now</a>
    </div>
</div>

</body>
</html>
