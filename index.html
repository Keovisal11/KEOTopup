<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEO Top-Up - សេវាកម្ម បញ្ចូលហ្គេមរហ័ស</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kantumruy Pro', sans-serif; }
        body { background-color: #0d1117; color: #f0f6fc; padding: 20px 15px; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 24px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #58a6ff; font-size: 24px; font-weight: 700; margin-bottom: 6px; }
        .header p { color: #8b949e; font-size: 14px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #c9d1d9; }
        input, select { width: 100%; padding: 12px 14px; background-color: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #f0f6fc; font-size: 15px; outline: none; }
        input:focus, select:focus { border-color: #58a6ff; }
        
        .package-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 8px; }
        .package-card { background: #0d1117; border: 1.5px solid #30363d; border-radius: 12px; padding: 14px 10px; text-align: center; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .package-card:hover { border-color: #58a6ff; background: #1f242d; transform: translateY(-2px); }
        .package-card.active { border-color: #238636; background: #102a1d; box-shadow: 0 0 12px rgba(35, 134, 54, 0.5); }
        .package-img { width: 48px; height: 48px; object-fit: contain; margin-bottom: 8px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }
        .package-title { font-size: 14px; font-weight: 600; color: #f0f6fc; }
        .package-price { font-size: 13px; color: #3fb950; font-weight: 700; margin-top: 4px; background: rgba(63, 185, 80, 0.1); padding: 2px 10px; border-radius: 12px; }
        
        .qr-section { text-align: center; background: #0d1117; padding: 15px; border-radius: 10px; border: 1px solid #30363d; margin-bottom: 18px; }
        .qr-section img { width: 100%; max-width: 280px; height: auto; border-radius: 12px; border: 2px solid #58a6ff; margin-top: 10px; }
        .submit-btn { width: 100%; padding: 14px; background-color: #238636; color: #ffffff; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .submit-btn:hover { background-color: #2ea043; }
        .status-msg { margin-top: 15px; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; display: none; }
        .status-msg.success { background-color: #102a1d; color: #3fb950; border: 1px solid #238636; display: block; }
        .status-msg.error { background-color: #2a1010; color: #f85149; border: 1px solid #da3633; display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎮 KEO Top-Up</h1>
        <p>សេវាកម្មបញ្ចូល Diamond លឿនរហ័ស 24/7</p>
    </div>

    <form id="topupForm">
        <div class="form-group">
            <label for="gameSelect">ជ្រើសរើសហ្គេម (Select Game):</label>
            <select id="gameSelect" onchange="updatePackages()">
                <option value="Mobile Legends">Mobile Legends: Bang Bang</option>
                <option value="Free Fire">Free Fire</option>
            </select>
        </div>

        <div class="form-group">
            <label for="userId">Game ID / Player ID:</label>
            <input type="text" id="userId" placeholder="ឧទាហរណ៍៖ 12345678" required>
        </div>

        <div class="form-group" id="zoneIdGroup">
            <label for="zoneId">Zone ID (សម្រាប់ MLBB):</label>
            <input type="text" id="zoneId" placeholder="ឧទាហរណ៍៖ 1234">
        </div>

        <div class="form-group">
            <label for="userPhone">លេខទូរស័ព្ទ ឬ Telegram ទាក់ទង:</label>
            <input type="text" id="userPhone" placeholder="012 345 678" required>
        </div>

        <div class="form-group">
            <label>ជ្រើសរើសកញ្ចប់ (Select Package):</label>
            <div class="package-grid" id="packageGrid"></div>
        </div>

        <div class="qr-section">
            <label>សូមស្កែន QR Code ដើម្បីបង់ប្រាក់៖</label>
            <br>
            <img id="qrImage" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=00020101021138580009abaakhpp01110177611630215KEOVISAL%20MALEN5204599953038405802KH5914KEOVISAL%20MALEN6010Phnom%20Penh6304" alt="ABA KHQR KEOVISAL MALEN">
            <p style="font-size: 14px; color: #58a6ff; margin-top: 10px; font-weight: 700;">ឈ្មោះគណនី៖ KEOVISAL MALEN</p>
            <p style="font-size: 12px; color: #8b949e; margin-top: 2px;">USD: 017 761 163 | KHR: 017 761 164</p>
        </div>

        <button type="submit" class="submit-btn">🚀 បញ្ជូនការកុម្ម៉ង់ (Order Now)</button>
    </form>

    <div id="statusMsg" class="status-msg"></div>
</div>

<script>
    const mlbbDiamondImg = "https://img.icons8.com/isometric/100/diamond.png"; 
    const ffDiamondImg = "https://img.icons8.com/color/96/free-fire.png";
    const passCardImg = "https://img.icons8.com/color/96/vip.png";

    const mlbbPackages = [
        { name: "86 Diamonds", price: "$1.25", img: mlbbDiamondImg },
        { name: "172 Diamonds", price: "$2.50", img: mlbbDiamondImg },
        { name: "257 Diamonds", price: "$3.70", img: mlbbDiamondImg },
        { name: "344 Diamonds", price: "$4.90", img: mlbbDiamondImg },
        { name: "514 Diamonds", price: "$7.30", img: mlbbDiamondImg },
        { name: "706 Diamonds", price: "$9.80", img: mlbbDiamondImg },
        { name: "2195 Diamonds", price: "$29.50", img: mlbbDiamondImg },
        { name: "3688 Diamonds", price: "$48.00", img: mlbbDiamondImg },
        { name: "Weekly Pass", price: "$1.99", img: passCardImg },
        { name: "Twilight Pass", price: "$9.99", img: passCardImg }
    ];

    const ffPackages = [
        { name: "110 Diamonds", price: "$1.00", img: ffDiamondImg },
        { name: "231 Diamonds", price: "$2.00", img: ffDiamondImg },
        { name: "341 Diamonds", price: "$3.00", img: ffDiamondImg },
        { name: "572 Diamonds", price: "$5.00", img: ffDiamondImg },
        { name: "1163 Diamonds", price: "$10.00", img: ffDiamondImg },
        { name: "2398 Diamonds", price: "$20.00", img: ffDiamondImg },
        { name: "Weekly Member", price: "$2.20", img: passCardImg },
        { name: "Monthly Member", price: "$8.50", img: passCardImg }
    ];

    let selectedPackage = null;

    function updatePackages() {
        const game = document.getElementById("gameSelect").value;
        const grid = document.getElementById("packageGrid");
        const zoneGroup = document.getElementById("zoneIdGroup");

        grid.innerHTML = "";

        const packages = (game === "Mobile Legends") ? mlbbPackages : ffPackages;
        zoneGroup.style.display = (game === "Mobile Legends") ? "block" : "none";

        packages.forEach((pkg, index) => {
            const card = document.createElement("div");
            card.className = "package-card";
            if (index === 0) { card.classList.add("active"); selectedPackage = pkg; }
            
            card.innerHTML = `
                <img src="${pkg.img}" class="package-img" alt="Diamond">
                <div class="package-title">${pkg.name}</div>
                <div class="package-price">${pkg.price}</div>
            `;
            
            card.onclick = () => {
                document.querySelectorAll(".package-card").forEach(c => c.classList.remove("active"));
                card.classList.add("active");
                selectedPackage = pkg;
            };
            grid.appendChild(card);
        });
    }

    updatePackages();

    document.getElementById("topupForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const game = document.getElementById("gameSelect").value;
        const userId = document.getElementById("userId").value;
        const zoneId = document.getElementById("zoneId").value;
        const phone = document.getElementById("userPhone").value;
        const statusMsg = document.getElementById("statusMsg");

        const BOT_TOKEN = "8244501179:AAGBbG4PsC7rS7Gq2jmrBKqbQYiPbuFGXSE"; 
        const CHAT_ID = "5129300837";                   

        let text = `🛒 *មានការបញ្ជាទិញថ្មី (New Order)*\n\n`;
        text += `🎮 *ហ្គេម:* ${game}\n`;
        text += `🆔 *User ID:* \`${userId}\`\n`;
        if (game === "Mobile Legends") {
            text += `🌐 *Zone ID:* \`${zoneId}\`\n`;
        }
        text += `💎 *កញ្ចប់:* ${selectedPackage.name} (${selectedPackage.price})\n`;
        text += `📞 *លេខទាក់ទង:* ${phone}\n`;

        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: "Markdown" })
        })
        .then(res => res.json())
        .then(data => {
            if (data.ok) {
                statusMsg.className = "status-msg success";
                statusMsg.innerText = "✅ បញ្ជូនការកុម្ម៉ង់ជោគជ័យ! យើងខ្ញុំនឹងពិនិត្យមើល និងបញ្ចូលជូនឆាប់ៗ។";
                document.getElementById("topupForm").reset();
                updatePackages();
            } else {
                statusMsg.className = "status-msg error";
                statusMsg.innerText = "❌ មានបញ្ហា! សូមពិនិត្យមើលម្ដងទៀត។";
            }
        })
        .catch(err => {
            statusMsg.className = "status-msg error";
            statusMsg.innerText = "❌ បរាជ័យក្នុងការផ្ញើ!";
        });
    });
</script>

</body>
</html>
