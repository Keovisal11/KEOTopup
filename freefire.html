<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Top Up - KEO TOP UP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #ffb703;
            font-size: 24px;
        }
        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .card h3 {
            margin-bottom: 12px;
            font-size: 16px;
            color: #38bdf8;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 16px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .item {
            background-color: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
        }
        .item:hover {
            border-color: #22c55e;
            background-color: #14532d;
        }
        .item .diamonds {
            font-weight: bold;
            font-size: 16px;
            color: #ffb703;
        }
        .item .price {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .btn-submit {
            width: 100%;
            background-color: #22c55e;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-back {
            display: block;
            text-align: center;
            color: #94a3b8;
            margin-top: 15px;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🔥 Free Fire Top Up</h1>
        <p>បញ្ចូល Player ID ដើម្បីទិញ Diamond</p>
    </div>

    <!-- Step 1: Account Info -->
    <div class="card">
        <h3>១. បញ្ចូល Player ID ហ្គេម</h3>
        <input type="text" placeholder="ឧទាហរណ៍៖ 123456789" required>
    </div>

    <!-- Step 2: Choose Diamond -->
    <div class="card">
        <h3>២. ជ្រើសរើសចំនួន Diamond</h3>
        <div class="grid">
            <div class="item">
                <div class="diamonds">💎 100 Diamonds</div>
                <div class="price">$0.99</div>
            </div>
            <div class="item">
                <div class="diamonds">💎 210 Diamonds</div>
                <div class="price">$1.99</div>
            </div>
            <div class="item">
                <div class="diamonds">💎 530 Diamonds</div>
                <div class="price">$4.99</div>
            </div>
            <div class="item">
                <div class="diamonds">💎 1080 Diamonds</div>
                <div class="price">$9.99</div>
            </div>
        </div>
    </div>

    <!-- Submit Button -->
    <button class="btn-submit">បន្តទៅការបង់ប្រាក់</button>
    <a href="index.html" class="btn-back">← ត្រឡប់ទៅទំព័រដើម</a>
</div>

</body>
</html>
